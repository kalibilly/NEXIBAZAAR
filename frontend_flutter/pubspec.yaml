name: nexi_bazaar
description: "E-commerce mobile and desktop application for NexiBazaar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  
  # UI dependencies
  google_fonts: ^6.0.0
  cached_network_image: ^3.3.0
  
  # Navigation
  go_router: ^10.0.0
  
  # State management
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # API/Networking
  dio: ^5.3.0
  
  # Local storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Additional utilities
  intl: ^0.19.0
  url_launcher: ^6.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: GoogleSansFonts
      fonts:
        - asset: fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: fonts/GoogleSans-Medium.ttf
          weight: 500

name: Build macOS App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: frontend_flutter

      - name: Build macOS App
        run: flutter build macos --release -v
        working-directory: frontend_flutter

      - name: Create DMG (Optional)
        run: |
          cd frontend_flutter/build/macos/Build/Products/Release
          hdiutil create -volname NexiBazaar -srcfolder . -ov -format UDZO NexiBazaar.dmg
        continue-on-error: true

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: frontend_flutter/build/macos/Build/Products/Release/
          if-no-files-found: warn
          retention-days: 30

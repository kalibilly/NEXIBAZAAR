name: Build Linux App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            pkg-config \
            cmake \
            ninja-build \
            libssl-dev \
            libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get
        working-directory: frontend_flutter

      - name: Build Linux App
        run: flutter build linux --release -v
        working-directory: frontend_flutter

      - name: Create AppImage (Optional)
        run: |
          cd frontend_flutter/build/linux/x64/release/bundle
          tar czf nexi-bazaar-linux.tar.gz *
        continue-on-error: true

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: frontend_flutter/build/linux/x64/release/bundle/
          if-no-files-found: warn
          retention-days: 30
